[tool.ruff]
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Classic ruff defaults (E4/E7/E9/F). Pin explicitly so newer ruff releases
# that expand the default rule set don't suddenly fail CI.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
